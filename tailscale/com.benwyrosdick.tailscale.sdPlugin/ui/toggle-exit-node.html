<!doctype html>
<html>
	<head lang="en">
		<title>Toggle Exit Node Settings</title>
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>

	<body>
		<!--
		Exit-node candidates come from the plugin via the "getExitNodes" data source. The choice is remembered
		per account; when the chosen node isn't available, the key falls back to automatic selection.
		-->
		<sdpi-item label="Exit Node">
			<sdpi-select setting="exitNode" datasource="getExitNodes" show-refresh default="auto" loading="Loading exit nodes…"></sdpi-select>
		</sdpi-item>
		<sdpi-item>
			<p>Remembered per account; falls back to automatic if unavailable.</p>
		</sdpi-item>
	</body>
</html>
