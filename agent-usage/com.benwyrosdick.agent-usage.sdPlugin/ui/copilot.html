<!doctype html>
<html>
	<head lang="en">
		<title>GitHub Copilot Settings</title>
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>

	<body>
		<!--
		Monthly quotas from GitHub's Copilot user endpoint, using the GitHub CLI's login (gh auth login). Thresholds apply to percent used. Press the key to step through the quotas.
		-->
		<sdpi-item label="Window">
			<sdpi-select setting="window" datasource="getWindows" show-refresh default="" loading="Loading windows…"></sdpi-select>
		</sdpi-item>

		<sdpi-item label="Show">
			<sdpi-select setting="metric" default="used">
				<option value="used">Percent used</option>
				<option value="remaining">Percent left</option>
			</sdpi-select>
		</sdpi-item>

		<sdpi-item label="Style">
			<sdpi-select setting="style" default="ring">
				<option value="classic">Classic</option>
				<option value="neon">Neon</option>
				<option value="ring">Ring</option>
				<option value="bars">Bars</option>
				<option value="solid">Solid</option>
			</sdpi-select>
		</sdpi-item>

		<sdpi-item label="Content">
			<sdpi-select setting="layout" default="combined">
				<option value="combined">Usage and reset countdown</option>
				<option value="single">Usage only</option>
			</sdpi-select>
		</sdpi-item>

		<sdpi-item label="Label">
			<sdpi-textfield setting="label" placeholder="Copilot" maxlength="10"></sdpi-textfield>
		</sdpi-item>

		<sdpi-item label="Warning colors">
			<sdpi-checkbox setting="colorize" default="true" label="Amber, then red, as usage climbs"></sdpi-checkbox>
		</sdpi-item>

		<sdpi-item label="Warning at">
			<sdpi-select setting="warnAt" default="70">
				<option value="50">50%</option>
				<option value="55">55%</option>
				<option value="60">60%</option>
				<option value="65">65%</option>
				<option value="70">70%</option>
				<option value="75">75%</option>
				<option value="80">80%</option>
				<option value="85">85%</option>
				<option value="90">90%</option>
				<option value="95">95%</option>
				<option value="100">100%</option>
			</sdpi-select>
		</sdpi-item>

		<sdpi-item label="Critical at">
			<sdpi-select setting="critAt" default="90">
				<option value="50">50%</option>
				<option value="55">55%</option>
				<option value="60">60%</option>
				<option value="65">65%</option>
				<option value="70">70%</option>
				<option value="75">75%</option>
				<option value="80">80%</option>
				<option value="85">85%</option>
				<option value="90">90%</option>
				<option value="95">95%</option>
				<option value="100">100%</option>
			</sdpi-select>
		</sdpi-item>
	</body>
</html>
