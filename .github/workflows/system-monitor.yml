name: System Monitor

on:
  push:
    paths:
      - "system-monitor/**"
      - ".github/workflows/system-monitor.yml"
  pull_request:
    paths:
      - "system-monitor/**"
      - ".github/workflows/system-monitor.yml"

defaults:
  run:
    working-directory: system-monitor

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: system-monitor/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate plugin
        run: npm run validate

      - name: Package plugin
        run: npx streamdeck pack com.benwyrosdick.system-monitor.sdPlugin --output dist --force

      - uses: actions/upload-artifact@v4
        with:
          name: com.benwyrosdick.system-monitor.streamDeckPlugin
          path: system-monitor/dist/*.streamDeckPlugin
