<!doctype html>
<html>
	<head lang="en">
		<title>Overview Settings</title>
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>

	<body>
		<!--
		Up to five metrics stacked on one key (the system drive for Disk, download for Network). Press to refresh.
		-->
		<sdpi-item label="Metrics">
			<sdpi-checkbox-list setting="metrics" columns="2">
				<option value="cpu">CPU</option>
				<option value="gpu">GPU</option>
				<option value="memory">Memory</option>
				<option value="disk">Disk</option>
				<option value="network">Network</option>
			</sdpi-checkbox-list>
		</sdpi-item>

		<sdpi-item label="Warning colors">
			<sdpi-checkbox setting="colorize" default="true" label="Amber, then red, past the thresholds"></sdpi-checkbox>
		</sdpi-item>

		<sdpi-item label="Warning at">
			<sdpi-select setting="warnAt" default="70">
				<option value="50">50%</option>
				<option value="55">55%</option>
				<option value="60">60%</option>
				<option value="65">65%</option>
				<option value="70">70%</option>
				<option value="75">75%</option>
				<option value="80">80%</option>
				<option value="85">85%</option>
				<option value="90">90%</option>
				<option value="95">95%</option>
				<option value="100">100%</option>
			</sdpi-select>
		</sdpi-item>

		<sdpi-item label="Critical at">
			<sdpi-select setting="critAt" default="90">
				<option value="50">50%</option>
				<option value="55">55%</option>
				<option value="60">60%</option>
				<option value="65">65%</option>
				<option value="70">70%</option>
				<option value="75">75%</option>
				<option value="80">80%</option>
				<option value="85">85%</option>
				<option value="90">90%</option>
				<option value="95">95%</option>
				<option value="100">100%</option>
			</sdpi-select>
		</sdpi-item>
	</body>
</html>
