name: Agent Usage

on:
  push:
    paths:
      - "agent-usage/**"
      - ".github/workflows/agent-usage.yml"
  pull_request:
    paths:
      - "agent-usage/**"
      - ".github/workflows/agent-usage.yml"

defaults:
  run:
    working-directory: agent-usage

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: agent-usage/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate plugin
        run: npm run validate

      - name: Package plugin
        run: npx streamdeck pack com.benwyrosdick.agent-usage.sdPlugin --output dist --force

      - uses: actions/upload-artifact@v4
        with:
          name: com.benwyrosdick.agent-usage.streamDeckPlugin
          path: agent-usage/dist/*.streamDeckPlugin
